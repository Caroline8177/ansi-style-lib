[project]
name = "ansi-style-lib"
version = "0.1.1"
description = "Small, dependency-free helpers for colouring terminal output and for deciding whether colour should be emitted at all."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
